openapi: 3.1.0
info:
  title: Paw Time Platform API
  version: 0.1.0
  description: ワーカーアプリと採用企業アプリを接続する共通API。
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
  /v1/worker/jobs:
    get:
      operationId: listPublishedJobs
      responses:
        "200":
          description: 公開中の求人
  /v1/worker/applications:
    post:
      operationId: applyForJob
      responses:
        "201":
          description: 応募を作成
  /v1/worker/shifts:
    get:
      operationId: listWorkerShifts
      responses:
        "200":
          description: ワーカーの確定シフト
  /v1/business/jobs:
    get:
      operationId: listOrganizationJobs
      responses:
        "200":
          description: 企業の求人一覧
    post:
      operationId: createJob
      responses:
        "201":
          description: 求人を作成
  /v1/business/applications:
    get:
      operationId: listOrganizationApplications
      responses:
        "200":
          description: 企業への応募一覧
  /v1/business/shifts:
    get:
      operationId: listOrganizationShifts
      responses:
        "200":
          description: 企業の確定シフト
  /v1/business/applications/{applicationId}/decision:
    post:
      operationId: decideApplication
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 採用または不採用を記録
  /v1/business/shifts/{shiftId}/attendance:
    post:
      operationId: recordAttendance
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: 追記型の出退勤イベントを記録
  /v1/business/shifts/{shiftId}/attendance-summary:
    get:
      operationId: getAttendanceSummary
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 予定時刻と実績から算出した遅刻・出退勤情報
  /v1/business/evaluations:
    post:
      operationId: createEvaluation
      responses:
        "201":
          description: 評価を登録
  /v1/business/world:
    get:
      operationId: getEmployerWorld
      responses:
        "200":
          description: 企業の家と所持品を取得
  /v1/telemetry/events:
    post:
      operationId: postTelemetryEvents
      description: >-
        ゲームからの仮名イベントをバッチで受け取る。install_id はゲームが生成するUUIDでアカウントとは紐付かない。
        イベント種別とpropsは許可リスト（packages/api-contracts/src/telemetry.ts）で検証し、未知の種別・props・自由記述は拒否する。
        1バッチ最大50件・16KB、install_id ごとに毎分12バッチまで。text/plain（sendBeacon）も受け付ける。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "200":
          description: 受理件数と、拒否したイベントの位置・理由
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        i: { type: integer }
                        reason: { type: string }
        "400":
          description: バッチの形式が不正
        "413":
          description: バッチが大きすぎる
        "429":
          description: レート制限
    delete:
      operationId: deleteTelemetryInstall
      description: 本人の依頼による削除。install_id の全イベントを消す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [install_id]
              properties:
                install_id: { type: string, format: uuid }
      responses:
        "200":
          description: 削除件数
  /v1/insights/metrics:
    get:
      operationId: getInsightsMetrics
      description: >-
        集計値のみ。5インストール未満のセルは null（非表示）。mode=simulated は乱数シード付きの合成データで、
        レスポンスの synthetic が true になる。
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [live, simulated], default: live }
        - name: demo
          in: query
          description: 1 のとき demo_session のイベントだけを集計
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: InsightsMetricsResponseSchema（packages/api-contracts）
  /v1/insights/feed:
    get:
      operationId: getInsightsFeed
      description: 直近30分の匿名アクティビティ。install_id は返さない。
      parameters:
        - name: demo
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: InsightsFeedResponseSchema（packages/api-contracts）
components:
  schemas:
    TelemetryBatch:
      type: object
      additionalProperties: false
      required: [install_id, events]
      properties:
        install_id: { type: string, format: uuid }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/TelemetryEvent"
    TelemetryEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        t: { type: number, description: unix秒。サーバー時刻から大きくずれる値はサーバー時刻に置き換える }
        type:
          type: string
          enum: [app_open, job_cards_shown, job_card_open, job_accept, job_pass, shift_start, shift_end, cat_tired_stop,
            review_submitted, practice_done, skill_badge_share_toggled, shop_island_visit, scoop_night, hatch,
            island_expand, island_share, outfit_change, calendar_add, suggestions_toggled, chat_open, chat_signal,
            anon_issue_sent, faq_auto_answered, shop_message_sent]
          description: >-
            chat_signal は固定タグのみ（生の会話文は端末から出さない）で、private_mode:false が必須。
            anon_issue_sent は本人がお店への匿名伝達に同意したときだけ送る。
        props:
          type: object
          description: 種別ごとの許可props（enum・整数範囲・真偽値のみ）。全種別で demo_session:boolean を許可。
